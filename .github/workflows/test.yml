name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  testV5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test

  testV4:
    needs: testV5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Change dependency
        run: |
          sed -i 's/"typescript": ".*"/"typescript": "~4.x"/' package.json
      - name: Install dependencies
        run: npm i --force
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test

  testV3:
    needs: testV4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Change dependency
        run: |
          sed -i 's/"typescript": "\~4.x"/"typescript": "~3.x"/' package.json
      - name: Install dependencies
        run: npm i --force
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
